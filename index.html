<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Practice Project</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 0 20px;
            line-height: 1.6;
            color: #333;
        }
        h1 {
            color: #2b6cb0;
        }
        .card {
            background: #f7fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Hello, Git!</h1>
    <p>I edited this.</p>
    
    <div class="card">
        <h2>Git Workflow Checklist</h2>
        <ul>
            <li>[ ] Edit this file</li>
            <li>[ ] Run <code>git status</code></li>
            <li>[ ] Stage with <code>git add index.html</code></li>
            <li>[ ] Commit with <code>git commit -m "Update index.html"</code></li>
        </ul>
    </div>
</body>
</html>
